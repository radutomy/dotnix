new-session -d -s main -n stack -c ~
split-window -h -p 30 -c ~
new-window -n cache -c ~/dotnix
split-window -h -p 30 -c ~/dotnix
split-window -v -p 25 -c ~/dotnix
select-pane -L
select-window -t 0

# Nested tmux: Alt+hjkl moves between panes and windows of this inner session
bind -n M-h if -F "#{pane_at_left}" "prev" "selectp -L"
bind -n M-j selectp -D
bind -n M-k selectp -U
bind -n M-l if -F "#{pane_at_right}" "next" "selectp -R"
