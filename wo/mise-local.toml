# --- Formatting ---

[tasks."rust:fmt"]
run = "cargo fmt --all"

[tasks."check:fmt"]
run = "cargo fmt --all -- --check"

# --- Core ---

[tasks.core]
env = { MOSAIC_SHUTDOWN_WITH_STDIN = "false" }
run = [
  "cargo build --locked -p video-streaming --bin video_grpc_server",
  "cargo run --locked -p mosaic --bin mosaic",
]

[tasks.frontend]
run = "pnpx wait-on tcp:127.0.0.1:8080 && pnpm --dir ~/src/mosaic-uxs_mosaic-frontend dev --host"

[tasks.sim]
run = "tail -f /dev/null | cargo run -p flight-simulation-qs"

# --- Meteomatics ---

[tasks.meteomatics]
depends = ["core", "meteomatics:driver", "sim"]

[tasks."meteomatics:ui"]
depends = ["meteomatics", "frontend"]

[tasks."meteomatics:driver"]
run = "pnpx wait-on tcp:127.0.0.1:3000 && set -a && . ~/dotnix/wo/.env && set +a && cargo run -p mosaic-meteomatics-driver"

# --- Radios ---

[tasks.radios]
depends = ["core", "frontend", "radionor", "silvus"]

[tasks.radionor]
env = { RUST_LOG = "info" }
run = "pnpx wait-on tcp:127.0.0.1:3000 && tail -f /dev/null | cargo run --bin radionor-client"

[tasks.silvus]
run = "pnpx wait-on tcp:127.0.0.1:3000 && tail -f /dev/null | cargo run --bin silvus-client"
