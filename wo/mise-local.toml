# --- Formatting ---

[tasks."rust:fmt"]
run = "cargo fmt --all"

[tasks."check:fmt"]
run = "cargo fmt --all -- --check"

# --- Builds ---

[tasks."build:battlefield-ui"]
dir = "{{cwd}}/battlefield/ui"
run = "trunk build --release"

# --- Core pieces ---

[tasks.core]
env = { MOSAIC_SHUTDOWN_WITH_STDIN = "false" }
run = [
  "cargo build --locked -p video-streaming --bin video_grpc_server",
  "cargo run --locked -p mosaic --bin mosaic",
]

[tasks.sim]
run = "tail -f /dev/null | cargo run -p flight-simulation-qs"

[tasks.frontend]
run = "pnpx wait-on tcp:127.0.0.1:8080 && pnpm --dir ~/src/mosaic-uxs_mosaic-frontend dev"

# --- Meteomatics ---

[tasks.meteomatics]
depends = ["core", "meteomatics:driver", "sim"]

[tasks."meteomatics:ui"]
depends = ["meteomatics", "frontend"]

[tasks."meteomatics:driver"]
run = "pnpx wait-on tcp:127.0.0.1:3000 && set -a && . ~/dotnix/wo/.env && set +a && cargo run -p mosaic-meteomatics-driver"

# --- RadioNOR ---

[tasks.radionor]
description = "Run Core and the RadioNOR driver against connected radios"
depends = ["core", "radionor:driver"]

[tasks."radionor:ui"]
description = "Run the RadioNOR stack with the frontend"
depends = ["radionor", "frontend"]

[tasks."radionor:driver"]
description = "Wait for Core, then run the RadioNOR driver"
env = { RUST_LOG = "info" }
run = "pnpx wait-on tcp:127.0.0.1:3000 && cargo run --locked -p radionor-client"

[tasks."radionor:test"]
description = "Run RadioNOR unit tests and query connected radios"
run = [
  "cargo test --locked -p radionor-api-client -p radionor-client",
  "cargo test --locked -p radionor-api-client --test hardware -- --ignored --nocapture",
]
